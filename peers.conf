# Friendly names for Miracast peers, one per line: MAC=Name
# Example: 9A:03:CF:FC:40:A3=Living Room TV
# Lines starting with # are ignored. MAC matching is case-insensitive.
# An alias wins over every automatic source. Without one, the widget shows
# the NetworkManager P2P device name, then the mDNS hostname, then the raw
# "Wi-Fi P2P Peer <MAC>" string.
9A:03:CF:FC:40:A3=Beamer
